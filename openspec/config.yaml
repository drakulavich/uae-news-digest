schema: spec-driven

context: |
  uae-news-digest (`@drakulavich/uae-news-digest`): a Bun-native CLI + programmatic
  API that turns Google News RSS into a daily, ranked, deduplicated UAE news Digest
  — a terminal briefing or clean JSON for scripts and agents — with optional DeepL
  translation. The Pipeline (`src/pipeline.ts`, `runDigest`) fetches RSS, normalizes,
  scores, dedups by title similarity, applies the Signal filter (surface important
  news, drop PR noise), limits, and renders (text or `--json`); a Seen-item state
  file suppresses repeats across runs, and Region presets (`uae`/`us`/`uk`/`de`) or
  a topics config scope the feed. Commands: the default digest (with `--match` /
  `--match-mode`, `--hours`, `--limit`, `--dry-run`, `--prompt`, …), `manifest`, and
  `healthcheck`.
  Two interfaces: the CLI (`uae-news-digest`, Commander-based `src/index.ts`) and the
  programmatic API (`@drakulavich/uae-news-digest/core`, `src/core.ts`).
  Conventions: Bun-only (`Bun.spawn` / `Bun.write` / `Bun.file` / `Bun.$`; TypeScript
  run directly, no build step; `bin` -> `src/index.ts`); `main` is protected, all
  changes go through PRs and CI must pass; use git worktrees for multi-file changes;
  run `bun test` before every push; errors are human-readable and carry context.
  See openspec/specs/README.md for personas and reading order, GLOSSARY.md for
  canonical terms.

rules:
  proposal:
    - Always include a "Non-goals" section
  specs:
    - Use glossary terms from openspec/specs/GLOSSARY.md verbatim
    - Every requirement needs at least one happy-path and one error/edge scenario
    - State outcomes, not implementation mechanisms, in requirement text
    - Reference named personas (Layla/Omar/Sana), never a generic "user"
    - Record anything uncertain or where spec and code disagree under "Open Issues" — never invent a resolution
    - Trace each requirement to code with file:line refs in a Technical Note
