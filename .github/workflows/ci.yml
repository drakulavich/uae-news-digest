name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  size:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: drakulavich/bite-the-diff@v1.1.0

  test:
    name: test (${{ matrix.os }})
    needs: size
    # size is skipped on push; != failure lets test run then
    if: ${{ !cancelled() && needs.size.result != 'failure' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run smoke:pack
